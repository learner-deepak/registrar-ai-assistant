<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar's AI Assistant</title>
  <!-- Tailwind CSS CDN for modern UI styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-[#0693e3] text-white p-4 shadow-md flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center p-1">
  <img
    src="images/logo.png"
    alt="Registrar Office AI Assistant Logo"
    class="w-8 h-8 object-contain"
  />
</div>
      <div>
        <h1 class="text-xl font-bold">Registrar's Office AI Assistant</h1>
        <p class="text-xs text-[#bde6fb]">Built with Official Academic Guidelines</p>
      </div>
    </div>
    <span class="px-3 py-1 bg-green-500 text-white text-xs font-semibold rounded-full">System Online</span>
  </header>

  <!-- Chat Container -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
    <!-- Welcome Message -->
    <div class="flex items-start space-x-3">
      <div class="w-8 h-8 rounded-full bg-[#0693e3] text-white flex items-center justify-center text-sm font-bold">AI</div>
      <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 max-w-lg">
        <p class="text-gray-800 text-sm">
          Hello! I am your Registrar's Office Assistant. Ask me your queries regarding academic policies, credit requirements, or degree completion.
        </p>
      </div>
    </div>
  </main>

  <!-- Input Area -->
  <footer class="bg-white border-t border-gray-200 p-4">
    <form id="chat-form" class="max-w-4xl mx-auto flex items-center space-x-3">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Ask a question about university guidelines..." 
        class="flex-1 border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#0693e3]"
        required
      />
      <button 
        type="submit" 
        id="send-btn"
        class="bg-[#0693e3] hover:bg-[#0586d1] text-white font-medium px-6 py-3 rounded-lg text-sm transition-colors duration-150 flex items-center space-x-2"
      >
        <span>Send</span>
      </button>
    </form>
  </footer>

  <!-- Frontend Logic -->
  <script>
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Helper: Append User Message to Chat Box
    function appendUserMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-start justify-end space-x-3';
      msgDiv.innerHTML = `
        <div class="bg-[#0693e3] text-white p-4 rounded-lg shadow-sm max-w-lg">
          <p class="text-sm">${escapeHtml(text)}</p>
        </div>
        <div class="w-8 h-8 rounded-full bg-gray-600 text-white flex items-center justify-center text-sm font-bold">You</div>
      `;
      chatBox.appendChild(msgDiv);
      scrollToBottom();
    }

    // Helper: Create an empty AI message container for live streaming
    function createStreamingAiMessage() {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-start space-x-3';
      
      msgDiv.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-[#0693e3] text-white flex items-center justify-center text-sm font-bold">AI</div>
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 max-w-lg w-full">
            <p class="text-gray-800 text-sm leading-relaxed whitespace-pre-wrap ai-text-content"></p>
            <div class="ai-citations-content mt-3 hidden"></div>
        </div>
      `;
      chatBox.appendChild(msgDiv);
      scrollToBottom();

      // Return references to the DOM elements so we can update them directly
      return {
        textElement: msgDiv.querySelector('.ai-text-content'),
        citationsElement: msgDiv.querySelector('.ai-citations-content')
      };
    }

    // Helper: Render Citations into a specific container
    function renderCitations(citations, containerElement) {
        if (!citations || citations.length === 0) return;

        let citationsHtml = "<div class='sources-container'><strong>SOURCES:</strong><br>";
        
        // Clean the file names AND remove duplicates
        const uniqueFiles = [...new Set(citations.map(raw => raw.split('\\').pop().split('/').pop()))];

        uniqueFiles.forEach(cleanFileName => {
            const fileUrl = `https://registrar-ai-assistant.onrender.com/files/${encodeURIComponent(cleanFileName)}`;
            citationsHtml += `<a href="${fileUrl}" target="_blank" style="display: inline-block; background-color: #e0f2fe; color: #0284c7; padding: 6px 12px; margin: 4px 4px 0 0; border-radius: 4px; text-decoration: none; font-size: 0.85em; border: 1px solid #bae6fd;">
                📄 ${cleanFileName}
            </a>`;
        });
        
        citationsHtml += "</div>";
        containerElement.innerHTML = citationsHtml;
        containerElement.classList.remove('hidden'); // Make it visible
    }

    // Helper: Append a standalone Error message
    function appendErrorMessage(text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'flex items-start space-x-3';
        msgDiv.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center text-sm font-bold">!</div>
            <div class="bg-red-50 p-4 rounded-lg shadow-sm border border-red-200 max-w-lg text-red-700 text-sm">
                ${escapeHtml(text)}
            </div>
        `;
        chatBox.appendChild(msgDiv);
        scrollToBottom();
    }

    // Helper: Append Loading Spinner
    function appendLoadingIndicator() {
      const loadingDiv = document.createElement('div');
      loadingDiv.id = 'loading-indicator';
      loadingDiv.className = 'flex items-start space-x-3';
      loadingDiv.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-[#0693e3] text-white flex items-center justify-center text-sm font-bold">AI</div>
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 max-w-lg flex items-center space-x-2">
          <div class="w-2 h-2 bg-[#0693e3] rounded-full animate-bounce"></div>
          <div class="w-2 h-2 bg-[#0693e3] rounded-full animate-bounce [animation-delay:-0.15s]"></div>
          <div class="w-2 h-2 bg-[#0693e3] rounded-full animate-bounce [animation-delay:-0.3s]"></div>
          <span class="text-xs text-gray-500 ml-2">Thinking...</span>
        </div>
      `;
      chatBox.appendChild(loadingDiv);
      scrollToBottom();
    }

    function removeLoadingIndicator() {
      const loader = document.getElementById('loading-indicator');
      if (loader) loader.remove();
    }

    function scrollToBottom() {
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // Handle Form Submission (Updated for SSE Streaming)
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = userInput.value.trim();
      if (!query) return;

      appendUserMessage(query);
      userInput.value = '';
      sendBtn.disabled = true;
      appendLoadingIndicator();

      try {
        const response = await fetch('https://registrar-ai-assistant.onrender.com/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query })
        });

        removeLoadingIndicator();

        if (!response.ok) {
          throw new Error(`Server returned status code ${response.status}`);
        }

        // Initialize the empty streaming UI elements
        const { textElement, citationsElement } = createStreamingAiMessage();
        
        // Setup stream reader
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        
        let fullAnswer = "";
        let savedCitations = [];

        // Read chunks as they arrive
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            // Decode the chunk into text and split by SSE formatting
            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split("\n\n");

            for (const line of lines) {
                if (line.startsWith("data: ")) {
                    const dataStr = line.replace("data: ", "").trim();

                    // Check if stream is finished
                    if (dataStr === "[DONE]") {
                        if (savedCitations.length > 0) {
                            renderCitations(savedCitations, citationsElement);
                            scrollToBottom();
                        }
                        break;
                    }

                    try {
                        const parsed = JSON.parse(dataStr);

                        if (parsed.type === "citations") {
                            // Save citations to render at the end
                            savedCitations = parsed.content;
                        } else if (parsed.type === "token") {
                            // Append token and update UI instantly
                            fullAnswer += parsed.content;
                            textElement.textContent = fullAnswer; // Using textContent for safe text rendering
                            scrollToBottom();
                        } else if (parsed.type === "error") {
                            textElement.textContent = "Error: " + parsed.content;
                        }
                    } catch (err) {
                        // Ignore partial JSON fragments across chunks
                    }
                }
            }
        }

      } catch (error) {
        removeLoadingIndicator();
        appendErrorMessage("Error connecting to the registrar service. Please ensure the backend server is running.");
        console.error("API Request Failed:", error);
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
